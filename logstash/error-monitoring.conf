########################################################################
# Logstash pipeline: error-monitoring.conf
#
# Purpose
#   - Ingest application/service logs
#   - Gracefully handle & log parse/runtime errors (no silent data loss)
#   - Track in/out event metrics to guard against queue backpressure
#   - Isolate ERROR-level / keyword-matched events via conditional
#     "grep-style" filtering before they hit downstream outputs
#
# Pair this file with:
#   - pipelines.yml   (registers this pipeline + queue/DLQ settings)
#   - logstash.yml    (node-level monitoring / persistent queue settings)
########################################################################

input {
  # --- Primary ingestion path: Filebeat/Elastic Agent shipping app logs ---
  beats {
    port => 5044
    # ssl_enabled => true
    # ssl_certificate => "/etc/logstash/certs/ls.crt"
    # ssl_key         => "/etc/logstash/certs/ls.key"
    tags => ["app_log", "beats_input"]
  }

  # --- Optional secondary path: direct file tailing (useful for on-box agents) ---
  # file {
  #   path            => "/var/log/myapp/*.log"
  #   start_position  => "beginning"
  #   sincedb_path    => "/var/lib/logstash/sincedb_myapp"
  #   tags            => ["app_log", "file_input"]
  # }
}

filter {

  # ---------------------------------------------------------------------
  # 1) STRUCTURED PARSING
  #    grok failures are NOT fatal — Logstash auto-tags them
  #    "_grokparsefailure" and the event continues down the pipeline
  #    instead of crashing the worker thread. We handle that tag below.
  # ---------------------------------------------------------------------
  grok {
    match => {
      "message" => "%{TIMESTAMP_ISO8601:log_timestamp}\s+%{LOGLEVEL:loglevel}\s+\[%{DATA:service}\]\s+%{GREEDYDATA:log_message}"
    }
    tag_on_failure => ["_grokparsefailure"]
  }

  date {
    match       => ["log_timestamp", "ISO8601"]
    target      => "@timestamp"
    tag_on_failure => ["_dateparsefailure"]
  }

  mutate {
    remove_field => ["log_timestamp"]
  }

  # ---------------------------------------------------------------------
  # 2) GRACEFUL ERROR HANDLING
  #    Anything Logstash itself failed to parse gets clearly tagged,
  #    counted, and routed to a dedicated diagnostics stream in the
  #    output block — it is never silently dropped.
  # ---------------------------------------------------------------------
  if "_grokparsefailure" in [tags] or "_dateparsefailure" in [tags] {
    mutate {
      add_tag   => ["pipeline_parse_error"]
      add_field => { "error_reason" => "failed to parse source event in error-monitoring.conf" }
    }
  }

  # ---------------------------------------------------------------------
  # 3) "GREP" / CONDITIONAL FILTER LOGIC
  #    The standalone `grep` filter plugin was removed from modern
  #    Logstash — the supported, idiomatic replacement is conditional
  #    (if/elsif) logic using field comparisons and =~ regex matches.
  #    Below we isolate ERROR-level events and specific keyword/pattern
  #    matches (exceptions, timeouts, failed auth, stack traces) by
  #    tagging them — later stages route on that tag.
  # ---------------------------------------------------------------------
  if [loglevel] == "ERROR" or [loglevel] == "FATAL" {
    mutate { add_tag => ["error_event"] }
  } else if [log_message] =~ /(?i)(exception|traceback|failed|timeout|connection refused|out of memory)/ {
    mutate { add_tag => ["error_event", "keyword_match"] }
  } else {
    mutate { add_tag => ["normal_event"] }
  }

  # Example of a stricter "grep -v" style exclusion: silently drop pure
  # health-check noise so it never reaches storage or metrics counters.
  if [log_message] =~ /(?i)^healthcheck (ok|passed)/ {
    drop {}
  }

  # ---------------------------------------------------------------------
  # 4) IN/OUT METRICS TRACKING
  #    Emits periodic synthetic "metric" events (default flush every
  #    5s) carrying events.in / events.out / rate_1m counters for this
  #    filter stage. Combine with the Monitoring API (see below) to
  #    watch for growing in/out deltas -> backpressure early warning.
  # ---------------------------------------------------------------------
  metrics {
    meter               => ["events_in"]
    add_tag             => ["metric_in"]
    flush_interval      => 10
    clear_interval      => 300
    ignore_older_than   => 0
  }

  if "error_event" in [tags] {
    metrics {
      meter          => ["error_events"]
      add_tag        => ["metric_error"]
      flush_interval => 10
    }
  }
}

output {

  # -----------------------------------------------------------------
  # A) Metric heartbeat events -> lightweight monitoring index only.
  #    Kept separate so they never pollute application log indices.
  # -----------------------------------------------------------------
  if "metric_in" in [tags] or "metric_error" in [tags] {
    elasticsearch {
      hosts => ["https://es-node1:9200"]
      index => "logstash-pipeline-metrics-%{+YYYY.MM.dd}"
      user  => "${ES_USER}"
      password => "${ES_PASSWORD}"
    }
  }

  # -----------------------------------------------------------------
  # B) Parse errors -> dedicated diagnostics index + local file log,
  #    so failures are always visible and never lost.
  # -----------------------------------------------------------------
  else if "pipeline_parse_error" in [tags] {
    elasticsearch {
      hosts => ["https://es-node1:9200"]
      index => "logstash-parse-errors-%{+YYYY.MM.dd}"
      user  => "${ES_USER}"
      password => "${ES_PASSWORD}"
    }
    file {
      path => "/var/log/logstash/pipeline-parse-errors.log"
    }
  }

  # -----------------------------------------------------------------
  # C) Isolated ERROR / keyword-matched events -> fast-path error
  #    index (short retention, tight refresh) for alerting/dashboards.
  # -----------------------------------------------------------------
  else if "error_event" in [tags] {
    elasticsearch {
      hosts => ["https://es-node1:9200"]
      index => "app-errors-%{+YYYY.MM.dd}"
      user  => "${ES_USER}"
      password => "${ES_PASSWORD}"
    }

    # Optional: near-real-time alert hook (Slack/PagerDuty webhook, etc.)
    # http {
    #   url            => "https://hooks.example.com/alert"
    #   http_method    => "post"
    #   format         => "json"
    # }
  }

  # -----------------------------------------------------------------
  # D) Everything else -> standard application log index.
  # -----------------------------------------------------------------
  else {
    elasticsearch {
      hosts => ["https://es-node1:9200"]
      index => "app-logs-%{+YYYY.MM.dd}"
      user  => "${ES_USER}"
      password => "${ES_PASSWORD}"
    }
  }

  # Uncomment while developing/debugging locally:
  # stdout { codec => rubydebug }
}
