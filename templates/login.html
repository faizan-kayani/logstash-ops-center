<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in &mdash; Logstash Monitoring</title>
  <link rel="icon" type="image/jpeg" href="/static/logstash-logo.jpg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="login-icon">
        <img src="/static/logstash-logo.jpg" alt="Logstash">
      </div>
      <h1>Logstash Monitoring</h1>
      <p class="login-subheading">Sign in to your account</p>

      {% if error %}
      <div class="login-error">{{ error }}</div>
      {% endif %}

      <form method="post">
        <div class="field-group">
          <label>Username</label>
          <input type="text" name="username" value="{{ form.get('username', '') }}" required autofocus>
        </div>

        <div class="field-group">
          <label>Password</label>
          <div class="password-field">
            <input type="password" name="password" id="passwordInput" autocomplete="current-password" required>
            <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary-full">
          Sign in
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
        </button>
        <p class="login-note">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          Ask your administrator if you don't have an account.
        </p>
      </form>
    </div>

    <div class="login-shell-footer">
      <span class="login-shell-footer-dot"></span>
      Powered by <strong>F3 Devops Team</strong>
    </div>
  </div>

  <script>
    const passwordInput = document.getElementById("passwordInput");
    const passwordToggle = document.getElementById("passwordToggle");
    passwordToggle.addEventListener("click", () => {
      const showing = passwordInput.type === "text";
      passwordInput.type = showing ? "password" : "text";
      passwordToggle.classList.toggle("is-visible", !showing);
    });
  </script>
</body>
</html>
